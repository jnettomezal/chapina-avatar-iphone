
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chapina V4 - Zigzag</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  touch-action: none;
}
#chapina {
  position: fixed;
  left: 0;
  top: 0;
  font-size: 80px;
  line-height: 1;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  cursor: grab;
  will-change: transform;
}
#chapina:active {
  cursor: grabbing;
}
</style>
</head>
<body>
<div id="chapina">🌺</div>
<script>
const avatar = document.getElementById("chapina");

let x = 40;
let y = window.innerHeight * 0.7;
let directionX = 1;
let directionY = -1;
let dragging = false;
let pointerX = 0;
let pointerY = 0;
let lastTime = 0;

const speedX = 115;
const speedY = 75;

function bounds() {
  return {
    maxX: Math.max(0,
      window.innerWidth - avatar.offsetWidth),
    maxY: Math.max(0,
      window.innerHeight - avatar.offsetHeight)
  };
}

function clampPosition() {
  const b = bounds();
  x = Math.max(0, Math.min(b.maxX, x));
  y = Math.max(0, Math.min(b.maxY, y));
}

function render() {
  avatar.style.transform =
    `translate3d(${x}px, ${y}px, 0)`;
}

function animate(time) {
  if (!lastTime) lastTime = time;
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  if (!dragging) {
    const b = bounds();
    x += directionX * speedX * dt;
    y += directionY * speedY * dt;

    if (x >= b.maxX) {
      x = b.maxX;
      directionX = -1;
    } else if (x <= 0) {
      x = 0;
      directionX = 1;
    }

    if (y <= 0) {
      y = 0;
      directionY = 1;
    } else if (y >= b.maxY) {
      y = b.maxY;
      directionY = -1;
    }
  }

  clampPosition();
  render();
  requestAnimationFrame(animate);
}

avatar.addEventListener("pointerdown", e => {
  dragging = true;
  pointerX = e.clientX - x;
  pointerY = e.clientY - y;
  avatar.setPointerCapture(e.pointerId);
});

avatar.addEventListener("pointermove", e => {
  if (!dragging) return;
  x = e.clientX - pointerX;
  y = e.clientY - pointerY;
  clampPosition();
  render();
});

function stopDragging() {
  dragging = false;
}

avatar.addEventListener("pointerup", stopDragging);
avatar.addEventListener("pointercancel", stopDragging);

window.addEventListener("resize", () => {
  clampPosition();
  render();
});

clampPosition();
render();
requestAnimationFrame(animate);
</script>
</body>
</html>
